<!--
  This file contains hidden form definitions for Netlify Forms detection.
  Netlify needs to parse these at build time to enable form submissions.
  DO NOT DELETE THIS FILE.
-->
<!DOCTYPE html>
<html>
<head>
  <title>Form Definitions for Netlify</title>
</head>
<body>
  <!-- Quote Request Form -->
  <form name="quote-request" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="text" name="company" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="industry" />
    <input type="text" name="products" />
    <input type="text" name="solutions" />
    <input type="text" name="area" />
    <input type="text" name="location" />
    <input type="text" name="timeline" />
    <input type="text" name="budget" />
    <textarea name="details"></textarea>
    <input type="text" name="bot-field" />
    <input type="hidden" name="subject" value="New Quote Request from Website" />
  </form>

  <!-- Contact Form -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="text" name="company" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="subject" />
    <textarea name="message"></textarea>
    <input type="text" name="bot-field" />
  </form>

  <!-- Career Application Form -->
  <form name="career-application" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="position" />
    <input type="text" name="experience" />
    <input type="text" name="currentCompany" />
    <input type="text" name="currentCTC" />
    <input type="text" name="expectedCTC" />
    <input type="text" name="noticePeriod" />
    <input type="text" name="location" />
    <textarea name="coverLetter"></textarea>
    <input type="text" name="linkedIn" />
    <input type="text" name="portfolio" />
    <input type="text" name="bot-field" />
    <input type="hidden" name="subject" value="New Career Application from Website" />
  </form>

  <!-- Partner Application Form -->
  <form name="partner-application" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="text" name="company" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="partnerType" />
    <input type="text" name="region" />
    <input type="text" name="experience" />
    <textarea name="message"></textarea>
    <input type="text" name="bot-field" />
    <input type="hidden" name="subject" value="New Partner Application from Website" />
  </form>

  <!-- Vendor Registration Form -->
  <form name="vendor-registration" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="companyName" />
    <input type="text" name="contactPerson" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="businessType" />
    <input type="text" name="products" />
    <input type="text" name="location" />
    <input type="text" name="gstNumber" />
    <textarea name="description"></textarea>
    <input type="text" name="bot-field" />
    <input type="hidden" name="subject" value="New Vendor Registration from Website" />
  </form>

  <!-- Newsletter Subscription -->
  <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
    <input type="email" name="email" />
    <input type="text" name="bot-field" />
  </form>
</body>
</html>
