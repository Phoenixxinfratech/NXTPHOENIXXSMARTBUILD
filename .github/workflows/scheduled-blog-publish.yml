name: Scheduled Blog Publisher

on:
  schedule:
    # Runs at 5:30 AM IST (00:00 UTC) on Monday, Wednesday, Friday
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    env:
      NETLIFY_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - name: Check if blogs are due
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          DAY=$(date -u +%A)
          echo "Today is $TODAY ($DAY)"
          echo "today=$TODAY" >> $GITHUB_OUTPUT

      - name: Validate build hook secret
        run: |
          HOOK_URL=$(echo "$NETLIFY_HOOK" | tr -d '[:space:]')
          if [ -z "$HOOK_URL" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set. Go to repo Settings > Secrets > Actions and add it."
            exit 1
          fi
          echo "Build hook secret is configured."

      - name: Trigger Netlify Build
        run: |
          HOOK_URL=$(echo "$NETLIFY_HOOK" | tr -d '[:space:]')
          echo "Triggering Netlify rebuild to publish scheduled blogs..."
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" -X POST -d '{}' "$HOOK_URL")
          echo "Netlify responded with HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Netlify build hook returned HTTP $HTTP_CODE. Verify the URL is correct."
            exit 1
          fi
          echo "Build triggered successfully at $(date -u)"

      - name: Log publish event
        run: |
          echo "=== Blog Autopilot Log ==="
          echo "Date: $(date -u +%Y-%m-%d)"
          echo "Day: $(date -u +%A)"
          echo "Netlify rebuild triggered to publish any blogs scheduled for today."
          echo "========================="
